<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫析安 | 个人主页</title>
<meta name="description" content="我的个人主页">

<style>
  :root{
    --bg:#0f1220; --card:#181c30; --text:#e8eaf6; --muted:#9aa0c0;
    --accent:#7c8cff; --line:#252a45;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7fb; --card:#ffffff; --text:#1b1e2e; --muted:#5c6280;
      --accent:#4c5bdc; --line:#e6e8f2;
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:48px 20px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7;
  }
  .wrap{ max-width:760px; margin:0 auto; }
  header{
    text-align:center; padding:32px 22px; border-radius:18px;
    border:1px solid var(--line);
    background:linear-gradient(135deg,var(--card),transparent);
  }
  h1{ margin:0 0 6px; font-size:2.1rem; letter-spacing:1px; }
  .tag{ color:var(--muted); margin:0 0 20px; min-height:1.7em; }
  .links{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  a.btn{
    display:inline-block; padding:8px 18px; border-radius:999px; text-decoration:none;
    color:#fff; background:var(--accent); font-size:.92rem; transition:.2s;
  }
  a.btn:hover{ filter:brightness(1.15); }
  a.ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }
  h2{ font-size:1rem; color:var(--muted); margin:32px 0 10px; letter-spacing:1px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 22px; margin-bottom:12px;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  ul{ margin:0; padding-left:20px; }
  li{ margin:5px 0; }
  .card p{ margin:6px 0 0; color:var(--muted); font-size:.9rem; }
  footer{ text-align:center; color:var(--muted); font-size:.85rem; margin-top:36px; }
  .cursor{ display:inline-block; width:8px; background:var(--accent); animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>狂暴睡觉组长</h1>
    <p class="tag"><span id="typed"></span><span class="cursor"></span></p>
    <div class="links">
      <a class="btn" href="https://github.com/Mostync" target="_blank" rel="noreferrer noopener">GitHub</a>
      <a class="btn ghost" href="mailto:you@example.com" target="_blank" rel="noreferrer noopener">Email</a>
      <a class="btn ghost" href="https://www.bilibili.com" target="_blank" rel="noreferrer noopener">B站</a>
    </div>
  </header>

  <h2>🧭 正在学习</h2>
  <div class="card">
    <ul>
      <li>😴 睡觉
    </ul>
  </div>

  <h2>🔧 常用工具</h2>
  <div class="grid">
    <div class="card">
      <strong>被子/ 床单</strong>
      <p>不用这个根本睡不了吧！</p>
    </div>
    <div class="card">
      <strong>枕头</strong>
      <p>或许这样头就不会睡扁了</p>
    </div>
    <div class="card">
      <strong>毯子</strong>
      <p>如果冬天…</p>
    </div>
  </div>

  <h2>📝 关于我</h2>
  <div class="card">
    🛏️ 加入神圣的睡觉教！
  </div>

  <footer>© <span id="year"></span>狂暴睡觉组长</footer>

</div>

<script>
  const phrases = ["每天学一点睡觉", "把睡觉变成生产力工具", "用GitHub宣传睡觉"];
  let i = 0, j = 0;
  const el = document.getElementById('typed');
  function type() {
    if (j <= phrases[i].length) {
      el.textContent = phrases[i].slice(0, j++);
      setTimeout(type, 90);
    } else {
      setTimeout(() => {
        j = 0; el.textContent = '';
        i = (i + 1) % phrases.length;
